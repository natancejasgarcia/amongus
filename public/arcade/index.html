<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <style>
    body { overflow: auto; }
    .menu { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; gap: 28px; }
    .menu h1 { font-family: 'Press Start 2P', monospace; font-size: clamp(28px, 7vw, 56px); margin: 0; letter-spacing: 4px; }
    .menu h1 span { color: var(--accent); }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: min(900px, 100%); }
    .card {
      display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: var(--panel);
      border: 2px solid var(--line); color: var(--text); text-decoration: none; transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--c); }
    .card svg { width: 100%; height: auto; background: #000; border-radius: 10px; }
    .card h2 { font-family: 'Press Start 2P', monospace; font-size: 15px; margin: 4px 0 0; color: var(--c); }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .card small { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--muted); }
    @media (max-width: 720px) { .cards { grid-template-columns: 1fr; max-width: 420px; } }
  </style>
</head>
<body>
  <main class="menu">
    <a href="../" style="color:var(--muted);text-decoration:none;font-weight:700">← Volver a Among Us</a>
    <h1>ARC<span>A</span>DE</h1>
    <div class="cards">
      <a class="card" href="pong.html" style="--c: var(--text)">
        <svg viewBox="0 0 160 90">
          <line x1="80" y1="4" x2="80" y2="86" stroke="#fff" stroke-width="3" stroke-dasharray="7 7" />
          <rect x="10" y="12" width="4" height="22" rx="2" fill="#fff" />
          <rect x="146" y="46" width="4" height="22" rx="2" fill="#fff" />
          <circle cx="124" cy="56" r="5" fill="#fff" />
        </svg>
        <h2>PONG</h2>
        <p>El clásico. Contra la máquina o contra un amigo en el mismo teclado.</p>
        <small id="best-pong"></small>
      </a>
      <a class="card" href="tetris.html" style="--c: var(--cyan)">
        <svg viewBox="0 0 160 90">
          <g stroke="#000" stroke-width="1.5">
            <rect x="50" y="70" width="10" height="10" fill="#3ee6ff" /><rect x="60" y="70" width="10" height="10" fill="#3ee6ff" /><rect x="70" y="70" width="10" height="10" fill="#3ee6ff" /><rect x="80" y="70" width="10" height="10" fill="#3ee6ff" />
            <rect x="90" y="70" width="10" height="10" fill="#ffd23f" /><rect x="100" y="70" width="10" height="10" fill="#ffd23f" /><rect x="90" y="60" width="10" height="10" fill="#ffd23f" /><rect x="100" y="60" width="10" height="10" fill="#ffd23f" />
            <rect x="50" y="60" width="10" height="10" fill="#b44dff" /><rect x="60" y="60" width="10" height="10" fill="#b44dff" /><rect x="70" y="60" width="10" height="10" fill="#b44dff" /><rect x="60" y="50" width="10" height="10" fill="#b44dff" />
            <rect x="75" y="15" width="10" height="10" fill="#ff4d4d" /><rect x="85" y="15" width="10" height="10" fill="#ff4d4d" /><rect x="85" y="25" width="10" height="10" fill="#ff4d4d" /><rect x="95" y="25" width="10" height="10" fill="#ff4d4d" />
          </g>
          <rect x="48" y="4" width="64" height="78" fill="none" stroke="#34373e" stroke-width="2" />
        </svg>
        <h2>TETRIS</h2>
        <p>Rápido de verdad: caída instantánea, reserva y modo sprint de 40 líneas.</p>
        <small id="best-tetris"></small>
      </a>
      <a class="card" href="breakout.html" style="--c: var(--pink)">
        <svg viewBox="0 0 160 90">
          <g>
            <rect x="12" y="10" width="24" height="7" rx="1" fill="#ff4d8d" /><rect x="40" y="10" width="24" height="7" rx="1" fill="#ff4d8d" /><rect x="68" y="10" width="24" height="7" rx="1" fill="#ff4d8d" /><rect x="96" y="10" width="24" height="7" rx="1" fill="#ff4d8d" /><rect x="124" y="10" width="24" height="7" rx="1" fill="#ff4d8d" />
            <rect x="12" y="20" width="24" height="7" rx="1" fill="#ffd23f" /><rect x="68" y="20" width="24" height="7" rx="1" fill="#ffd23f" /><rect x="96" y="20" width="24" height="7" rx="1" fill="#ffd23f" /><rect x="124" y="20" width="24" height="7" rx="1" fill="#ffd23f" />
            <rect x="12" y="30" width="24" height="7" rx="1" fill="#3ee6ff" /><rect x="40" y="30" width="24" height="7" rx="1" fill="#3ee6ff" /><rect x="124" y="30" width="24" height="7" rx="1" fill="#3ee6ff" />
          </g>
          <circle cx="58" cy="52" r="4" fill="#fff" /><circle cx="96" cy="60" r="4" fill="#fff" />
          <rect x="60" y="78" width="40" height="5" rx="2.5" fill="#fff" />
        </svg>
        <h2>BREAKOUT</h2>
        <p>Rompe ladrillos con multibola, power-ups y combos. Cada nivel, más rápido.</p>
        <small id="best-breakout"></small>
      </a>
    </div>
  </main>
  <script src="shared.js"></script>
  <script>
    const b = (k) => Arcade.getBest(k);
    if (b('pong')) document.getElementById('best-pong').textContent = `VICTORIAS VS CPU: ${b('pong')}`;
    if (b('tetris')) document.getElementById('best-tetris').textContent = `RECORD: ${b('tetris')}`;
    if (b('breakout')) document.getElementById('best-breakout').textContent = `RECORD: ${b('breakout')}`;
  </script>
</body>
</html>
