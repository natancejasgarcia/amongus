<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Breakout</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a href="index.html">← Arcade</a>
      <h1>BREAKOUT</h1>
      <span class="best" id="best"></span>
    </div>
    <div class="stage">
      <canvas class="game" id="c"></canvas>
      <div class="overlay" id="menu">
        <h2>BREAKOUT</h2>
        <p>Rompe todos los ladrillos. Encadena golpes sin tocar la pala para multiplicar puntos.</p>
        <p style="font-size:14px">
          <b style="color:#ff4d8d">M</b> multibola · <b style="color:#3ee6ff">W</b> pala ancha ·
          <b style="color:#5dff8a">S</b> bola lenta · <b style="color:#ff9f3f">F</b> bola de fuego · <b style="color:#ffd23f">+</b> vida
        </p>
        <button class="btn" id="play">¡Jugar!</button>
        <p class="keys">Ratón o <kbd>←</kbd><kbd>→</kbd> para mover · <kbd>ESPACIO</kbd>/clic para lanzar · <kbd>P</kbd> pausa</p>
      </div>
      <div class="overlay hidden" id="over">
        <h2 id="overTitle">FIN</h2>
        <p id="overSub"></p>
        <div class="row"><button class="btn" id="again">Otra vez</button></div>
      </div>
      <div class="overlay hidden" id="pause"><h2>PAUSA</h2><p>Pulsa P o toca para seguir</p></div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    const W = 480, H = 640;
    const canvas = document.getElementById('c');
    const ctx = Arcade.setupCanvas(canvas, W, H);
    const fx = Arcade.particles();
    const $ = (id) => document.getElementById(id);

    const ROW_COLORS = ['#ff4d8d', '#ff4d4d', '#ff9f3f', '#ffd23f', '#5dff8a', '#3ee6ff', '#4d7cff', '#b44dff'];
    const POWER = {
      multi: { label: 'M', color: '#ff4d8d', weight: 3 },
      wide: { label: 'W', color: '#3ee6ff', weight: 3 },
      slow: { label: 'S', color: '#5dff8a', weight: 2 },
      fire: { label: 'F', color: '#ff9f3f', weight: 2 },
      life: { label: '+', color: '#ffd23f', weight: 0.6 },
    };
    const BR = 7, PADDLE_Y = H - 44, PADDLE_H = 12;

    let state = 'menu';
    let paddle, balls, bricks, drops, texts;
    let score, lives, level, combo, shake, banner;
    let timers = { wide: 0, slow: 0, fire: 0 };

    // ---- niveles ----
    function makeLevel(n) {
      const cols = 10, gap = 4, margin = 16;
      const bw = (W - margin * 2 - gap * (cols - 1)) / cols, bh = 18, top = 76;
      const list = [];
      const add = (r, c, hp) => list.push({
        x: margin + c * (bw + gap), y: top + r * (bh + gap), w: bw, h: bh, hp, max: hp, color: ROW_COLORS[r % ROW_COLORS.length], hit: 0,
      });
      const pattern = (n - 1) % 5;
      const extra = Math.floor((n - 1) / 5); // cada vuelta, más resistentes
      for (let r = 0; r < 8; r++) for (let c = 0; c < cols; c++) {
        let hp = 0;
        if (pattern === 0) hp = r < 6 ? 1 : 0;
        else if (pattern === 1) hp = Math.abs(c - 4.5) <= r * 0.7 + 0.5 ? (r < 2 ? 2 : 1) : 0;
        else if (pattern === 2) hp = (r + c) % 2 === 0 ? (r < 3 ? 2 : 1) : 0;
        else if (pattern === 3) { const d = Math.abs(c - 4.5) + Math.abs(r - 3.5); hp = d <= 5 ? (d <= 2 ? 3 : d <= 3.5 ? 2 : 1) : 0; }
        else hp = Math.random() < 0.75 ? 1 + Math.floor(Math.random() * 3) : 0;
        if (hp) add(r, c, Math.min(5, hp + extra));
      }
      return list;
    }

    // ---- entrada ----
    const keys = new Set();
    addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      keys.add(k);
      if (['arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
      if (k === ' ' && state === 'play') launch();
      if (k === 'p' && (state === 'play' || state === 'pause')) togglePause();
    });
    addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
    addEventListener('blur', () => { keys.clear(); if (state === 'play') togglePause(); });
    canvas.addEventListener('pointermove', (e) => { if (state === 'play') paddle.x = Arcade.toLocal(canvas, e, W, H).x; });
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      if (state !== 'play') return;
      paddle.x = Arcade.toLocal(canvas, e, W, H).x;
      launch();
    });
    $('pause').addEventListener('click', togglePause);
    function togglePause() {
      state = state === 'play' ? 'pause' : 'play';
      $('pause').classList.toggle('hidden', state !== 'pause');
    }

    $('play').onclick = start;
    $('again').onclick = start;
    const showBest = () => { const b = Arcade.getBest('breakout'); $('best').textContent = b ? `RECORD ${b}` : ''; };
    showBest();

    function start() {
      score = 0; lives = 3; level = 1;
      $('menu').classList.add('hidden');
      $('over').classList.add('hidden');
      fx.clear();
      startLevel();
      state = 'play';
    }

    function startLevel() {
      paddle = { x: W / 2, w: 92, baseW: 92 };
      bricks = makeLevel(level);
      drops = []; texts = [];
      timers = { wide: 0, slow: 0, fire: 0 };
      combo = 0; shake = 0;
      resetBall();
      banner = { text: `NIVEL ${level}`, t: 1.6 };
    }

    function resetBall() {
      balls = [{ x: paddle.x, y: PADDLE_Y - BR - 1, vx: 0, vy: 0, stuck: true, trail: [] }];
      combo = 0;
    }

    const baseSpeed = () => (380 + (level - 1) * 28) * (timers.slow > 0 ? 0.62 : 1);

    function launch() {
      for (const b of balls) {
        if (!b.stuck) continue;
        const a = (Math.random() - 0.5) * 0.7;
        const s = baseSpeed();
        b.vx = Math.sin(a) * s;
        b.vy = -Math.cos(a) * s;
        b.stuck = false;
        Arcade.beep(600, 0.05, 'square', 0.04, 900);
      }
    }

    function setSpeed(b) {
      const s = baseSpeed();
      const cur = Math.hypot(b.vx, b.vy) || 1;
      b.vx *= s / cur;
      b.vy *= s / cur;
      // evita trayectorias casi horizontales
      if (Math.abs(b.vy) < s * 0.25) {
        b.vy = Math.sign(b.vy || -1) * s * 0.25;
        b.vx = Math.sign(b.vx) * Math.sqrt(s * s - b.vy * b.vy);
      }
    }

    function floatText(x, y, text, color) { texts.push({ x, y, text, color, t: 0.9 }); }

    function hitBrick(br, b) {
      br.hp -= timers.fire > 0 ? br.hp : 1;
      br.hit = 1;
      combo++;
      const mult = 1 + Math.floor(combo / 4);
      if (br.hp <= 0) {
        const pts = 10 * br.max * mult;
        score += pts;
        fx.burst(br.x + br.w / 2, br.y + br.h / 2, br.color, 16, 260, 0.6);
        if (mult > 1) floatText(br.x + br.w / 2, br.y, `x${mult}`, '#ffd23f');
        Arcade.beep(420 + Math.min(combo, 20) * 40, 0.05, 'square', 0.045);
        shake = Math.min(shake + 2, 8);
        if (Math.random() < 0.16) dropPower(br.x + br.w / 2, br.y + br.h / 2);
      } else {
        score += 5;
        fx.burst(br.x + br.w / 2, br.y + br.h / 2, '#fff', 5, 160, 0.3);
        Arcade.beep(260, 0.04, 'triangle', 0.05);
      }
    }

    function dropPower(x, y) {
      const entries = Object.entries(POWER);
      let r = Math.random() * entries.reduce((s, [, p]) => s + p.weight, 0);
      for (const [type, p] of entries) { r -= p.weight; if (r <= 0) { drops.push({ x, y, type }); return; } }
    }

    function applyPower(type, x) {
      const p = POWER[type];
      fx.burst(x, PADDLE_Y, p.color, 20, 240, 0.5);
      Arcade.beep(700, 0.12, 'triangle', 0.05, 1400);
      if (type === 'multi') {
        const src = balls.find((b) => !b.stuck) || balls[0];
        for (const off of [-0.5, 0.5]) {
          const s = baseSpeed();
          const a = Math.atan2(src.vx || 0.01, -(src.vy || -1)) + off;
          balls.push({ x: src.x, y: src.y, vx: Math.sin(a) * s, vy: -Math.abs(Math.cos(a) * s), stuck: false, trail: [] });
        }
        floatText(x, PADDLE_Y - 20, 'MULTIBOLA', p.color);
      } else if (type === 'wide') { timers.wide = 12; floatText(x, PADDLE_Y - 20, 'PALA ANCHA', p.color); }
      else if (type === 'slow') { timers.slow = 8; balls.forEach(setSpeed); floatText(x, PADDLE_Y - 20, 'LENTA', p.color); }
      else if (type === 'fire') { timers.fire = 7; floatText(x, PADDLE_Y - 20, '¡FUEGO!', p.color); }
      else if (type === 'life') { lives++; floatText(x, PADDLE_Y - 20, '+1 VIDA', p.color); }
    }

    function update(dt) {
      // temporizadores de power-ups
      const wasSlow = timers.slow > 0;
      for (const k in timers) timers[k] = Math.max(0, timers[k] - dt);
      if (wasSlow && timers.slow === 0) balls.forEach((b) => !b.stuck && setSpeed(b));
      const targetW = timers.wide > 0 ? paddle.baseW * 1.6 : paddle.baseW;
      paddle.w += (targetW - paddle.w) * Math.min(1, dt * 10);

      if (keys.has('arrowleft') || keys.has('a')) paddle.x -= 640 * dt;
      if (keys.has('arrowright') || keys.has('d')) paddle.x += 640 * dt;
      paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

      const steps = 5;
      for (const b of balls) {
        if (b.stuck) { b.x = paddle.x; b.y = PADDLE_Y - BR - 1; continue; }
        for (let i = 0; i < steps; i++) {
          const s = dt / steps;
          const px = b.x, py = b.y;
          b.x += b.vx * s;
          b.y += b.vy * s;
          if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx); }
          if (b.x > W - BR) { b.x = W - BR; b.vx = -Math.abs(b.vx); }
          if (b.y < BR + 40) { b.y = BR + 40; b.vy = Math.abs(b.vy); }

          // pala
          if (b.vy > 0 && b.y + BR >= PADDLE_Y && b.y - BR < PADDLE_Y + PADDLE_H && Math.abs(b.x - paddle.x) < paddle.w / 2 + BR) {
            const rel = Math.max(-1, Math.min(1, (b.x - paddle.x) / (paddle.w / 2)));
            const a = rel * (Math.PI / 3);
            const sp = baseSpeed();
            b.vx = Math.sin(a) * sp;
            b.vy = -Math.cos(a) * sp;
            b.y = PADDLE_Y - BR;
            combo = 0;
            Arcade.beep(330, 0.04, 'square', 0.04);
          }

          // ladrillos (uno por subpaso)
          for (const br of bricks) {
            if (br.hp <= 0) continue;
            const cx = Math.max(br.x, Math.min(b.x, br.x + br.w));
            const cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
            if ((b.x - cx) ** 2 + (b.y - cy) ** 2 > BR * BR) continue;
            if (timers.fire <= 0) {
              const wasOutX = px < br.x - BR * 0.5 || px > br.x + br.w + BR * 0.5;
              if (wasOutX) { b.vx = -b.vx; b.x = px; } else { b.vy = -b.vy; b.y = py; }
            }
            hitBrick(br, b);
            break;
          }
        }
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 8) b.trail.shift();
      }

      // bolas perdidas
      balls = balls.filter((b) => b.y < H + 20);
      if (balls.length === 0) {
        lives--;
        shake = 14;
        Arcade.beep(200, 0.35, 'sawtooth', 0.05, 60);
        if (lives <= 0) return gameOver();
        resetBall();
        timers = { wide: 0, slow: 0, fire: 0 };
      }

      // power-ups que caen
      for (const d of drops) {
        d.y += 150 * dt;
        if (d.y > PADDLE_Y - 8 && d.y < PADDLE_Y + PADDLE_H + 8 && Math.abs(d.x - paddle.x) < paddle.w / 2 + 12) {
          d.taken = true;
          applyPower(d.type, d.x);
        }
      }
      drops = drops.filter((d) => !d.taken && d.y < H + 20);

      bricks = bricks.filter((br) => br.hp > 0);
      bricks.forEach((br) => (br.hit = Math.max(0, br.hit - dt * 6)));
      if (bricks.length === 0) {
        score += 500 * level;
        level++;
        Arcade.beep(523, 0.1); setTimeout(() => Arcade.beep(659, 0.1), 90); setTimeout(() => Arcade.beep(784, 0.2), 180);
        startLevel();
      }
    }

    function gameOver() {
      state = 'over';
      const record = score > Arcade.getBest('breakout');
      if (record) Arcade.setBest('breakout', score);
      showBest();
      $('overSub').textContent = `Puntos: ${score} · Nivel ${level}${record ? ' · ¡NUEVO RÉCORD!' : ''}`;
      $('over').classList.remove('hidden');
    }

    function draw(dt) {
      ctx.save();
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

      if (paddle) {
        // HUD
        ctx.fillStyle = '#f4f4f0';
        ctx.font = '14px "Press Start 2P", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(String(score), 14, 28);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#8b8f98';
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillText(`NIVEL ${level}`, W / 2, 26);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ff4d8d';
        ctx.font = '14px "Press Start 2P", monospace';
        ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 14, 28);
        ctx.fillStyle = '#34373e';
        ctx.fillRect(0, 38, W, 2);

        // indicadores de power-ups activos
        let ix = 14;
        for (const k of ['wide', 'slow', 'fire']) {
          if (timers[k] <= 0) continue;
          ctx.fillStyle = POWER[k].color;
          ctx.fillRect(ix, H - 12, timers[k] * 8, 4);
          ix += timers[k] * 8 + 8;
        }

        for (const br of bricks) {
          ctx.fillStyle = br.hit > 0 ? '#fff' : br.color;
          ctx.globalAlpha = 0.45 + 0.55 * (br.hp / br.max);
          ctx.beginPath(); ctx.roundRect(br.x, br.y, br.w, br.h, 3); ctx.fill();
          ctx.globalAlpha = 1;
          if (br.max > 1) {
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.font = '9px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(String(br.hp), br.x + br.w / 2, br.y + br.h / 2 + 4);
          }
        }

        for (const d of drops) {
          const p = POWER[d.type];
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.roundRect(d.x - 14, d.y - 9, 28, 18, 9); ctx.fill();
          ctx.fillStyle = '#000';
          ctx.font = '10px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(p.label, d.x, d.y + 5);
        }

        ctx.fillStyle = timers.wide > 0 ? '#3ee6ff' : '#f4f4f0';
        ctx.beginPath(); ctx.roundRect(paddle.x - paddle.w / 2, PADDLE_Y, paddle.w, PADDLE_H, 6); ctx.fill();

        const fire = timers.fire > 0;
        for (const b of balls) {
          b.trail.forEach((t, i) => {
            ctx.globalAlpha = (i / b.trail.length) * (fire ? 0.6 : 0.3);
            ctx.fillStyle = fire ? '#ff9f3f' : '#fff';
            ctx.beginPath(); ctx.arc(t.x, t.y, BR * (i / b.trail.length), 0, Math.PI * 2); ctx.fill();
          });
          ctx.globalAlpha = 1;
          ctx.fillStyle = fire ? '#ffd23f' : '#fff';
          ctx.beginPath(); ctx.arc(b.x, b.y, BR, 0, Math.PI * 2); ctx.fill();
          if (fire && Math.random() < 0.5) fx.burst(b.x, b.y, '#ff9f3f', 1, 60, 0.3);
        }

        if (state === 'play' && balls.some((b) => b.stuck)) {
          ctx.fillStyle = 'rgba(244,244,240,0.7)';
          ctx.font = '10px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('TOCA O PULSA ESPACIO', W / 2, PADDLE_Y - 40);
        }

        for (const t of texts) {
          t.t -= dt; t.y -= 40 * dt;
          ctx.globalAlpha = Math.max(0, t.t / 0.9);
          ctx.fillStyle = t.color;
          ctx.font = '11px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(t.text, t.x, t.y);
        }
        ctx.globalAlpha = 1;
        texts = texts.filter((t) => t.t > 0);

        if (banner && banner.t > 0) {
          banner.t -= dt;
          ctx.globalAlpha = Math.min(1, banner.t);
          ctx.fillStyle = '#ffd23f';
          ctx.font = '26px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(banner.text, W / 2, H / 2 + 40);
          ctx.globalAlpha = 1;
        }
      }
      fx.draw(ctx);
      ctx.restore();
    }

    let last = performance.now();
    function loop(t) {
      const dt = Math.min((t - last) / 1000, 1 / 30);
      last = t;
      if (state === 'play') update(dt);
      fx.update(dt);
      shake = Math.max(0, (shake || 0) - dt * 30);
      draw(state === 'pause' ? 0 : dt);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
