<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pong</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a href="index.html">← Arcade</a>
      <h1>PONG</h1>
      <span class="best" id="best"></span>
    </div>
    <div class="stage">
      <canvas class="game" id="c"></canvas>
      <div class="overlay" id="menu">
        <h2>PONG</h2>
        <div class="row">
          <button class="btn sel" data-mode="1">1 jugador</button>
          <button class="btn ghost" data-mode="2">2 jugadores</button>
        </div>
        <div class="row" id="diffRow">
          <button class="btn ghost" data-diff="easy">Fácil</button>
          <button class="btn sel" data-diff="normal">Normal</button>
          <button class="btn ghost" data-diff="hard">Difícil</button>
        </div>
        <button class="btn" id="play">¡Jugar!</button>
        <p class="keys">Jugador 1: <kbd>W</kbd> <kbd>S</kbd> · Jugador 2: <kbd>↑</kbd> <kbd>↓</kbd> · <kbd>P</kbd> pausa · gana quien llegue a 7</p>
        <p class="keys" style="display:block">En móvil: arrastra el dedo en tu mitad de la pantalla.</p>
      </div>
      <div class="overlay hidden" id="over">
        <h2 id="overTitle"></h2>
        <p id="overSub"></p>
        <div class="row">
          <button class="btn" id="again">Otra vez</button>
          <button class="btn ghost" id="toMenu">Menú</button>
        </div>
      </div>
      <div class="overlay hidden" id="pause"><h2>PAUSA</h2><p>Pulsa P o toca para seguir</p></div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    const W = 800, H = 450, WIN = 7;
    const PW = 12, PH = 84, BR = 7;
    const canvas = document.getElementById('c');
    const ctx = Arcade.setupCanvas(canvas, W, H);
    const fx = Arcade.particles();
    const $ = (id) => document.getElementById(id);

    const DIFF = {
      easy: { speed: 250, error: 55 },
      normal: { speed: 380, error: 28 },
      hard: { speed: 560, error: 10 },
    };
    let mode = 1, diff = 'normal';
    let state = 'menu'; // menu | play | pause | over
    let shake = 0;

    const left = { x: 26, y: H / 2 - PH / 2, score: 0, target: null, flash: 0 };
    const right = { x: W - 26 - PW, y: H / 2 - PH / 2, score: 0, target: null, flash: 0 };
    const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, speed: 0, wait: 0, trail: [] };
    let cpuError = 0;

    const keys = new Set();
    addEventListener('keydown', (e) => {
      keys.add(e.key.toLowerCase());
      if (['arrowup', 'arrowdown', ' '].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key.toLowerCase() === 'p' && (state === 'play' || state === 'pause')) togglePause();
    });
    addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
    addEventListener('blur', () => { keys.clear(); if (state === 'play') togglePause(); });

    // Táctil / ratón: cada dedo mueve la pala de su mitad
    const pointers = new Map();
    canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pointerMove(e); });
    canvas.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || pointers.has(e.pointerId) || e.buttons) pointerMove(e); });
    const pointerEnd = (e) => {
      const side = pointers.get(e.pointerId);
      if (side) side.target = null;
      pointers.delete(e.pointerId);
    };
    canvas.addEventListener('pointerup', pointerEnd);
    canvas.addEventListener('pointercancel', pointerEnd);
    canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') pointerEnd(e); });
    function pointerMove(e) {
      const p = Arcade.toLocal(canvas, e, W, H);
      const side = mode === 1 || p.x < W / 2 ? left : right;
      side.target = p.y;
      pointers.set(e.pointerId, side);
    }
    $('pause').addEventListener('click', togglePause);

    function togglePause() {
      state = state === 'play' ? 'pause' : 'play';
      $('pause').classList.toggle('hidden', state !== 'pause');
    }

    // ---- menú ----
    document.querySelectorAll('[data-mode]').forEach((b) => b.onclick = () => {
      mode = Number(b.dataset.mode);
      document.querySelectorAll('[data-mode]').forEach((x) => x.className = 'btn ' + (x === b ? 'sel' : 'ghost'));
      $('diffRow').style.visibility = mode === 1 ? 'visible' : 'hidden';
    });
    document.querySelectorAll('[data-diff]').forEach((b) => b.onclick = () => {
      diff = b.dataset.diff;
      document.querySelectorAll('[data-diff]').forEach((x) => x.className = 'btn ' + (x === b ? 'sel' : 'ghost'));
    });
    $('play').onclick = start;
    $('again').onclick = start;
    $('toMenu').onclick = () => { $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); state = 'menu'; };
    const showBest = () => { const b = Arcade.getBest('pong'); $('best').textContent = b ? `VICTORIAS: ${b}` : ''; };
    showBest();

    function start() {
      left.score = right.score = 0;
      left.y = right.y = H / 2 - PH / 2;
      $('menu').classList.add('hidden');
      $('over').classList.add('hidden');
      fx.clear();
      serve(Math.random() < 0.5 ? -1 : 1);
      state = 'play';
    }

    function serve(dir) {
      ball.x = W / 2;
      ball.y = H / 2;
      ball.speed = 380;
      const a = (Math.random() - 0.5) * 0.8;
      ball.vx = Math.cos(a) * ball.speed * dir;
      ball.vy = Math.sin(a) * ball.speed;
      ball.wait = 0.8;
      ball.trail = [];
      cpuError = (Math.random() - 0.5) * 2 * DIFF[diff].error;
    }

    function movePaddle(p, up, down, dt) {
      const speed = 620;
      if (p.target != null) {
        const c = p.y + PH / 2;
        const d = p.target - c;
        p.y += Math.sign(d) * Math.min(Math.abs(d), 1100 * dt);
      } else {
        if (up) p.y -= speed * dt;
        if (down) p.y += speed * dt;
      }
      p.y = Math.max(0, Math.min(H - PH, p.y));
    }

    function cpu(p, dt) {
      const d = DIFF[diff];
      const coming = ball.vx > 0;
      let target = H / 2;
      if (coming && ball.wait <= 0) {
        // predice dónde llegará la bola, con rebotes en paredes
        const t = (p.x - ball.x) / ball.vx;
        let y = ball.y + ball.vy * t;
        const span = H - 2 * BR;
        y = ((y - BR) % (2 * span) + 2 * span) % (2 * span);
        y = (y > span ? 2 * span - y : y) + BR;
        target = y + cpuError;
      }
      const c = p.y + PH / 2;
      const diffY = target - c;
      if (Math.abs(diffY) > 6) p.y += Math.sign(diffY) * Math.min(Math.abs(diffY), d.speed * dt);
      p.y = Math.max(0, Math.min(H - PH, p.y));
    }

    function hitPaddle(p, dir) {
      const rel = Math.max(-1, Math.min(1, (ball.y - (p.y + PH / 2)) / (PH / 2)));
      const angle = rel * (Math.PI / 3);
      ball.speed = Math.min(ball.speed * 1.06, 1000);
      ball.vx = Math.cos(angle) * ball.speed * dir;
      ball.vy = Math.sin(angle) * ball.speed;
      p.flash = 1;
      fx.burst(ball.x, ball.y, '#fff', 10, 260, 0.35);
      Arcade.beep(dir > 0 ? 520 : 440, 0.05);
      if (p === left) cpuError = (Math.random() - 0.5) * 2 * DIFF[diff].error;
    }

    function point(winner) {
      winner.score++;
      shake = 12;
      fx.burst(ball.x < W / 2 ? 0 : W, ball.y, '#ffd23f', 30, 420, 0.7);
      Arcade.beep(180, 0.25, 'sawtooth', 0.05, 90);
      if (winner.score >= WIN) return end(winner);
      serve(winner === left ? 1 : -1);
    }

    function end(winner) {
      state = 'over';
      const leftWon = winner === left;
      if (mode === 1) {
        $('overTitle').textContent = leftWon ? '¡GANASTE!' : 'GANA LA CPU';
        if (leftWon) { Arcade.setBest('pong', Arcade.getBest('pong') + 1); showBest(); }
        Arcade.beep(leftWon ? 660 : 200, 0.3, 'square', 0.05, leftWon ? 1320 : 100);
      } else {
        $('overTitle').textContent = leftWon ? 'GANA JUGADOR 1' : 'GANA JUGADOR 2';
      }
      $('overSub').textContent = `${left.score} — ${right.score}`;
      $('over').classList.remove('hidden');
    }

    function update(dt) {
      movePaddle(left, keys.has('w') || (mode === 1 && keys.has('arrowup')), keys.has('s') || (mode === 1 && keys.has('arrowdown')), dt);
      if (mode === 1) cpu(right, dt);
      else movePaddle(right, keys.has('arrowup'), keys.has('arrowdown'), dt);
      left.flash = Math.max(0, left.flash - dt * 4);
      right.flash = Math.max(0, right.flash - dt * 4);

      if (ball.wait > 0) { ball.wait -= dt; return; }
      const steps = 4;
      for (let i = 0; i < steps; i++) {
        const s = dt / steps;
        ball.x += ball.vx * s;
        ball.y += ball.vy * s;
        if (ball.y < BR) { ball.y = BR; ball.vy = Math.abs(ball.vy); Arcade.beep(300, 0.03); }
        if (ball.y > H - BR) { ball.y = H - BR; ball.vy = -Math.abs(ball.vy); Arcade.beep(300, 0.03); }
        if (ball.vx < 0 && ball.x - BR < left.x + PW && ball.x > left.x && ball.y > left.y - BR && ball.y < left.y + PH + BR) {
          ball.x = left.x + PW + BR;
          hitPaddle(left, 1);
        }
        if (ball.vx > 0 && ball.x + BR > right.x && ball.x < right.x + PW && ball.y > right.y - BR && ball.y < right.y + PH + BR) {
          ball.x = right.x - BR;
          hitPaddle(right, -1);
        }
        if (ball.x < -20) return point(right);
        if (ball.x > W + 20) return point(left);
      }
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 10) ball.trail.shift();
    }

    function draw() {
      ctx.save();
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

      // red central discontinua, como en el dibujo
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.setLineDash([14, 22]);
      ctx.beginPath(); ctx.moveTo(W / 2, 12); ctx.lineTo(W / 2, H - 12); ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '40px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(left.score, W / 2 - 80, 64);
      ctx.fillText(right.score, W / 2 + 80, 64);

      for (const p of [left, right]) {
        ctx.fillStyle = p.flash > 0 ? `rgb(255,${210 + 45 * (1 - p.flash)},${63 + 192 * (1 - p.flash)})` : '#fff';
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, PW, PH, 6);
        ctx.fill();
      }

      ball.trail.forEach((t, i) => {
        ctx.globalAlpha = (i / ball.trail.length) * 0.35;
        ctx.beginPath(); ctx.arc(t.x, t.y, BR * (i / ball.trail.length), 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = ball.wait > 0 ? 0.4 + 0.6 * Math.abs(Math.sin(ball.wait * 10)) : 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BR + 2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;

      fx.draw(ctx);
      ctx.restore();
    }

    let last = performance.now();
    function loop(t) {
      const dt = Math.min((t - last) / 1000, 1 / 30);
      last = t;
      if (state === 'play') update(dt);
      fx.update(dt);
      shake = Math.max(0, shake - dt * 40);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
